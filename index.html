<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      :root {
        --md-sys-color-surface: #ffffff;
        --md-sys-color-surface-container: #f5f5f6;
        --md-sys-color-surface-container-high: #ececed;
        --md-sys-color-on-surface: #141416;
        --md-sys-color-on-surface-variant: #6b6b73;
        --md-sys-color-outline: #c8c8cf;
        --md-sys-color-primary: #141416;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-secondary-container: #e2e2e5;
        --md-sys-color-on-secondary-container: #141416;
        --md-shape-corner-small: 8px;
        --md-shape-corner-medium: 16px;
        --md-shape-corner-large: 28px;
        --md-shape-corner-full: 9999px;
        --shadow-color: rgba(0, 0, 0, 0.06);
        --content-width: 440px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        font-family: sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px;
      }
      .app-container {
        background-color: var(--md-sys-color-surface-container);
        border-radius: var(--md-shape-corner-large);
        padding: 32px 24px;
        width: 100%;
        max-width: var(--content-width);
        box-shadow: 0 10px 30px var(--shadow-color);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .game-container {
        width: 100%;
        max-width: 1000px;
        display: none;
        flex-direction: column;
        gap: 16px;
      }
      .result-container {
        background-color: var(--md-sys-color-surface-container);
        border-radius: var(--md-shape-corner-large);
        padding: 32px 24px;
        width: 100%;
        max-width: var(--content-width);
        box-shadow: 0 10px 30px var(--shadow-color);
        display: none;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }
      .btn {
        height: 44px;
        padding: 0 16px;
        border-radius: var(--md-shape-corner-full);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: 0.2s;
      }
      .btn-primary {
        background-color: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
      }
      .btn-secondary {
        background-color: var(--md-sys-color-secondary-container);
        color: var(--md-sys-color-on-secondary-container);
      }
      .btn-icon-square {
        width: 44px;
        padding: 0;
        border-radius: var(--md-shape-corner-full);
      }
      .btn-icon-square svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--md-sys-color-surface-container-high);
        padding: 12px;
        border-radius: var(--md-shape-corner-medium);
        position: sticky;
        top: 16px;
        z-index: 10;
      }
      .header-stats {
        display: flex;
        gap: 16px;
        font-weight: bold;
        font-size: 14px;
      }
      .header-route {
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .route-arrow {
        color: var(--md-sys-color-on-surface-variant);
        font-size: 12px;
      }
      .wiki-content {
        background: #fff;
        padding: 24px;
        border-radius: var(--md-shape-corner-medium);
        box-shadow: 0 4px 12px var(--shadow-color);
        min-height: 60vh;
        overflow-x: auto;
        line-height: 1.6;
      }
      .wiki-content a {
        color: #0645ad;
        text-decoration: none;
      }
      .wiki-content a:hover {
        text-decoration: underline;
      }
      .history-week-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--md-sys-color-surface-container-high);
        border-radius: var(--md-shape-corner-small);
        padding: 8px;
        margin-bottom: 12px;
      }
      .week-label {
        font-size: 14px;
        font-weight: 500;
      }
      .history-list-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .history-item {
        background: var(--md-sys-color-surface);
        padding: 12px;
        border-radius: var(--md-shape-corner-small);
        border: 1px solid var(--md-sys-color-outline);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .accordion {
        width: 100%;
        background: var(--md-sys-color-surface-container-high);
        border-radius: var(--md-shape-corner-small);
        overflow: hidden;
      }
      .accordion-summary {
        padding: 12px;
        cursor: pointer;
        font-weight: 500;
        display: flex;
        justify-content: space-between;
        user-select: none;
        list-style: none;
      }
      .accordion-summary::-webkit-details-marker {
        display: none;
      }
      .accordion-content {
        padding: 0 12px 12px;
        font-size: 13px;
        color: var(--md-sys-color-on-surface-variant);
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .modal.active {
        display: flex;
      }
      .modal-content {
        background: var(--md-sys-color-surface);
        padding: 24px;
        border-radius: var(--md-shape-corner-large);
        width: 90%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .input-field {
        width: 100%;
        height: 44px;
        background: var(--md-sys-color-surface-container-high);
        border: none;
        border-bottom: 2px solid var(--md-sys-color-outline);
        padding: 0 12px;
        border-radius: var(--md-shape-corner-small);
        font-size: 14px;
        outline: none;
      }
      .input-field:focus {
        border-bottom-color: var(--md-sys-color-primary);
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--md-sys-color-on-surface);
        color: var(--md-sys-color-surface);
        padding: 12px 24px;
        border-radius: var(--md-shape-corner-full);
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
      }
      .toast.show {
        opacity: 1;
      }
      footer {
        margin-top: 24px;
        font-size: 12px;
        color: var(--md-sys-color-outline);
      }
      footer a {
        color: var(--md-sys-color-outline);
        text-decoration: none;
      }
      .daily-sub-buttons {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }
      .daily-sub-buttons.active {
        display: flex;
      }
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-container">
      <h2
        id="dailyTitle"
        style="text-align: center; font-size: 18px; margin-bottom: 8px"
      >
        デイリーチャレンジ
      </h2>

      <button class="btn btn-primary" id="dailyMainBtn" style="width: 100%">
        デイリーチャレンジ
      </button>
      <div class="daily-sub-buttons" id="dailySubBtns">
        <button class="btn btn-secondary" id="dailyTightsToBtn">
          タイツ <span class="route-arrow">から</span>
          <span id="dailyArticleA"></span>
        </button>
        <button class="btn btn-secondary" id="dailyToTightsBtn">
          <span id="dailyArticleB"></span>
          <span class="route-arrow">から</span> タイツ
        </button>
      </div>

      <button class="btn btn-primary" id="endlessModalBtn" style="width: 100%">
        エンドレスモード
      </button>

      <h3 style="font-size: 16px; margin-top: 16px">
        過去のデイリーチャレンジ
      </h3>
      <div class="history-week-nav">
        <button class="btn btn-secondary btn-icon-square" id="prevWeekBtn">
          <svg viewBox="0 0 24 24">
            <path
              d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"
            />
          </svg>
        </button>
        <span class="week-label" id="currentWeekLabel"></span>
        <button class="btn btn-secondary btn-icon-square" id="nextWeekBtn">
          <svg viewBox="0 0 24 24">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z" />
          </svg>
        </button>
      </div>
      <div class="history-list-container" id="historyListContainer"></div>
    </div>

    <div id="endlessModal" class="modal">
      <div class="modal-content">
        <h3 style="text-align: center">エンドレスモード設定</h3>
        <div>
          <label
            style="
              font-size: 12px;
              color: var(--md-sys-color-on-surface-variant);
            "
            >スタート記事 (空欄でランダム)</label
          >
          <input
            type="text"
            id="endlessStartInput"
            class="input-field"
            placeholder="任意の記事名"
          />
        </div>
        <div>
          <label
            style="
              font-size: 12px;
              color: var(--md-sys-color-on-surface-variant);
            "
            >ゴール記事 (空欄でランダム)</label
          >
          <input
            type="text"
            id="endlessGoalInput"
            class="input-field"
            placeholder="任意の記事名"
          />
        </div>
        <div style="display: flex; gap: 8px; margin-top: 8px">
          <button class="btn btn-secondary" id="closeModalBtn" style="flex: 1">
            キャンセル
          </button>
          <button class="btn btn-primary" id="startEndlessBtn" style="flex: 1">
            スタート
          </button>
        </div>
      </div>
    </div>

    <div id="gameView" class="game-container">
      <div class="header-bar">
        <button class="btn btn-secondary" id="retireBtn">トップに戻る</button>
        <div class="header-route">
          <span id="gameStartTitle"></span>
          <span class="route-arrow">から</span>
          <span id="gameGoalTitle"></span>
        </div>
        <div class="header-stats">
          <span id="clickCountDisplay">0回</span>
          <span id="timeDisplay">00:00</span>
        </div>
      </div>
      <div id="wikiContent" class="wiki-content"></div>
    </div>

    <div id="resultView" class="result-container">
      <h2>クリア！</h2>
      <p
        id="resultMessage"
        style="text-align: center; font-weight: 500; line-height: 1.5"
      ></p>

      <details class="accordion">
        <summary class="accordion-summary">
          <span>クリック履歴</span>
          <svg
            viewBox="0 0 24 24"
            style="width: 18px; height: 18px; fill: currentColor"
          >
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
          </svg>
        </summary>
        <div class="accordion-content" id="resultHistoryList"></div>
      </details>

      <div
        style="
          display: flex;
          gap: 8px;
          width: 100%;
          justify-content: center;
          margin-top: 8px;
        "
      >
        <button class="btn btn-primary" id="shareTaittsuuBtn">
          タイッツーでシェア
        </button>
        <button class="btn btn-secondary" id="copyResultBtn">コピー</button>
      </div>
      <button
        class="btn btn-secondary"
        id="backToTopBtn"
        style="width: 100%; margin-top: 8px"
      >
        トップに戻る
      </button>
    </div>

    <div id="toast" class="toast"></div>
    <div id="loading" class="loading-overlay">読み込み中...</div>

    <footer>
      Created by
      <a href="https://x.com/cure88200" target="_blank">cure88200</a> -
      __BUILD_VERSION__
    </footer>

    <script>
      const appView = document.getElementById("app");
      const gameView = document.getElementById("gameView");
      const resultView = document.getElementById("resultView");
      const endlessModal = document.getElementById("endlessModal");
      const wikiContent = document.getElementById("wikiContent");
      const loading = document.getElementById("loading");

      let currentModeName = "";
      let currentStart = "";
      let currentGoal = "";
      let currentClicks = 0;
      let startTime = 0;
      let timerInterval = null;
      let clickHistory = [];
      let currentDailyArticle = "";

      let historyByWeek = [];
      let currentWeekIndex = 0;

      const API_BASE =
        "https://ja.wikipedia.org/w/api.php?origin=*&format=json";

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 3000);
      }

      function formatTime(sec) {
        const m = Math.floor(sec / 60)
          .toString()
          .padStart(2, "0");
        const s = (sec % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
      }

      async function fetchRandomArticle() {
        const res = await fetch(
          `${API_BASE}&action=query&list=random&rnnamespace=0&rnlimit=1`,
        );
        const data = await res.json();
        return data.query.random[0].title;
      }

      async function loadWikiPage(title) {
        loading.style.display = "flex";
        try {
          const res = await fetch(
            `${API_BASE}&action=parse&page=${encodeURIComponent(title)}&prop=text|displaytitle`,
          );
          const data = await res.json();
          if (data.error) throw new Error();

          wikiContent.innerHTML =
            `<h1 style="margin-bottom:16px;border-bottom:1px solid #ccc;padding-bottom:8px">${data.parse.displaytitle}</h1>` +
            data.parse.text["*"];

          const titleStr = data.parse.title;
          if (
            clickHistory.length === 0 ||
            clickHistory[clickHistory.length - 1] !== titleStr
          ) {
            clickHistory.push(titleStr);
            if (clickHistory.length > 1) {
              currentClicks++;
              document.getElementById("clickCountDisplay").textContent =
                `${currentClicks}回`;
            }
          }

          wikiContent.querySelectorAll("a").forEach((a) => {
            a.addEventListener("click", (e) => {
              e.preventDefault();
              const href = a.getAttribute("href");
              if (href && href.startsWith("/wiki/")) {
                const nextTitle = decodeURIComponent(
                  href.replace("/wiki/", ""),
                );
                if (!nextTitle.includes(":")) {
                  loadWikiPage(nextTitle);
                }
              }
            });
          });

          if (titleStr === currentGoal && clickHistory.length > 1) {
            gameClear();
          }
        } catch (e) {
          showToast("記事の読み込みに失敗しました");
        }
        loading.style.display = "none";
        window.scrollTo(0, 0);
      }

      async function startGame(start, goal, modeName) {
        currentStart = start;
        currentGoal = goal;
        currentModeName = modeName;
        currentClicks = 0;
        clickHistory = [];

        document.getElementById("gameStartTitle").textContent = start;
        document.getElementById("gameGoalTitle").textContent = goal;
        document.getElementById("clickCountDisplay").textContent = "0回";
        document.getElementById("timeDisplay").textContent = "00:00";

        appView.style.display = "none";
        resultView.style.display = "none";
        gameView.style.display = "flex";

        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          const s = Math.floor((Date.now() - startTime) / 1000);
          document.getElementById("timeDisplay").textContent = formatTime(s);
        }, 1000);

        await loadWikiPage(start);
      }

      function gameClear() {
        clearInterval(timerInterval);
        const sec = Math.floor((Date.now() - startTime) / 1000);

        gameView.style.display = "none";
        resultView.style.display = "flex";

        document.getElementById("resultMessage").innerHTML =
          `${currentModeName}を<br>"${currentStart}" <span style="color:var(--md-sys-color-on-surface-variant);font-size:12px">から</span> "${currentGoal}" でクリア！<br>
      クリック回数：${currentClicks}回<br>
      クリアタイム：${sec}秒`;

        const histHtml = clickHistory
          .map((h, i) => `<div>${i + 1}. ${h}</div>`)
          .join("");
        document.getElementById("resultHistoryList").innerHTML = histHtml;
      }

      function generateShareText() {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        return `${currentModeName}を"${currentStart}"から"${currentGoal}"でクリア！\nクリック回数：${currentClicks}回\nクリアタイム：${sec}秒\n#WikiRace\nhttps://cure88200.github.io/VoicePostGenerator`;
      }

      document
        .getElementById("shareTaittsuuBtn")
        .addEventListener("click", () => {
          const text = encodeURIComponent(generateShareText());
          window.open(`https://taittsuu.com/share_link?text=${text}`, "_blank");
        });

      document.getElementById("copyResultBtn").addEventListener("click", () => {
        navigator.clipboard
          .writeText(generateShareText())
          .then(() => showToast("コピーしました！"));
      });

      document.getElementById("dailyMainBtn").addEventListener("click", () => {
        const sub = document.getElementById("dailySubBtns");
        sub.classList.toggle("active");
      });

      document
        .getElementById("dailyTightsToBtn")
        .addEventListener("click", () => {
          startGame("タイツ", currentDailyArticle, "デイリーチャレンジ");
        });

      document
        .getElementById("dailyToTightsBtn")
        .addEventListener("click", () => {
          startGame(currentDailyArticle, "タイツ", "デイリーチャレンジ");
        });

      document
        .getElementById("endlessModalBtn")
        .addEventListener("click", () => {
          endlessModal.classList.add("active");
        });

      document.getElementById("closeModalBtn").addEventListener("click", () => {
        endlessModal.classList.remove("active");
      });

      document
        .getElementById("startEndlessBtn")
        .addEventListener("click", async () => {
          endlessModal.classList.remove("active");
          loading.style.display = "flex";

          let start = document.getElementById("endlessStartInput").value.trim();
          let goal = document.getElementById("endlessGoalInput").value.trim();

          if (!start) start = await fetchRandomArticle();
          if (!goal) goal = await fetchRandomArticle();

          startGame(start, goal, "エンドレスモード");
        });

      document.getElementById("retireBtn").addEventListener("click", () => {
        if (confirm("トップに戻りますか？")) {
          clearInterval(timerInterval);
          gameView.style.display = "none";
          appView.style.display = "flex";
        }
      });

      document.getElementById("backToTopBtn").addEventListener("click", () => {
        resultView.style.display = "none";
        appView.style.display = "flex";
      });

      function getWeekKey(dStr) {
        const d = new Date(dStr);
        const day = (d.getDay() + 6) % 7;
        d.setDate(d.getDate() - day + 3);
        const firstThu = d.valueOf();
        d.setMonth(0, 1);
        if (d.getDay() !== 4) d.setMonth(0, 1 + ((4 - d.getDay() + 7) % 7));
        const w = 1 + Math.ceil((firstThu - d) / 604800000);
        return `${d.getFullYear()}-W${w.toString().padStart(2, "0")}`;
      }

      function renderWeek() {
        if (historyByWeek.length === 0) {
          document.getElementById("currentWeekLabel").textContent = "履歴なし";
          return;
        }
        const w = historyByWeek[currentWeekIndex];
        const s = w.s,
          e = w.e;
        document.getElementById("currentWeekLabel").textContent =
          `${s.getMonth() + 1}/${s.getDate()} 〜 ${e.getMonth() + 1}/${e.getDate()}`;

        document.getElementById("prevWeekBtn").disabled =
          currentWeekIndex >= historyByWeek.length - 1;
        document.getElementById("nextWeekBtn").disabled = currentWeekIndex <= 0;

        document.getElementById("historyListContainer").innerHTML = w.items
          .map(
            (item) => `
      <div class="history-item">
        <div style="font-weight:500">${item.date}</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" style="flex:1;font-size:11px" onclick="startGame('タイツ','${item.articleTitle}','デイリーチャレンジ')">タイツから</button>
          <button class="btn btn-secondary" style="flex:1;font-size:11px" onclick="startGame('${item.articleTitle}','タイツ','デイリーチャレンジ')">タイツへ</button>
        </div>
      </div>
    `,
          )
          .join("");
      }

      document.getElementById("prevWeekBtn").addEventListener("click", () => {
        if (currentWeekIndex < historyByWeek.length - 1) {
          currentWeekIndex++;
          renderWeek();
        }
      });

      document.getElementById("nextWeekBtn").addEventListener("click", () => {
        if (currentWeekIndex > 0) {
          currentWeekIndex--;
          renderWeek();
        }
      });

      fetch("daily_history.json")
        .then((r) => r.json())
        .then((data) => {
          if (data && data.length > 0) {
            currentDailyArticle = data[0].articleTitle;
            document.getElementById("dailyArticleA").textContent =
              currentDailyArticle;
            document.getElementById("dailyArticleB").textContent =
              currentDailyArticle;

            const today = new Date(data[0].date);
            document.getElementById("dailyTitle").textContent =
              `${today.getMonth() + 1}月${today.getDate()}日のデイリーチャレンジ`;

            const groups = {};
            data.forEach((item) => {
              const k = getWeekKey(item.date);
              if (!groups[k])
                groups[k] = {
                  k,
                  items: [],
                  s: new Date(item.date),
                  e: new Date(item.date),
                };
              groups[k].items.push(item);
              const id = new Date(item.date);
              if (id < groups[k].s) groups[k].s = id;
              if (id > groups[k].e) groups[k].e = id;
            });
            historyByWeek = Object.values(groups).sort((a, b) =>
              b.k.localeCompare(a.k),
            );
            renderWeek();
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
